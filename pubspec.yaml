name: draksy
description: RPG Language Learning App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  audioplayers: ^6.0.0
  cached_network_image: ^3.4.1
  connectivity_plus: ^7.0.0
  device_preview_plus: ^2.6.1
  equatable: ^2.0.8
  fl_chart: ^1.1.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.7
  flutter_riverpod: ^3.0.3
  flutter_screenutil: ^5.9.3
  flutter_secure_storage: ^10.0.0
  flutter_svg: ^2.2.4
  flutter_tts: ^4.2.5
  get_it: ^9.2.1
  go_router: ^17.1.0
  google_fonts: ^8.0.2
  google_mobile_ads: ^8.0.0
  hive_ce: any
  hive_ce_flutter: any
  image_cropper: ^12.2.1
  image_picker: ^1.2.2
  in_app_purchase: ^3.2.3
  intl: ^0.20.2
  introduction_screen: ^4.0.0
  lottie: ^3.3.2
  package_info_plus: ^9.0.0
  path: ^1.9.1
  riverpod_annotation: ^4.0.0
  share_plus: ^12.0.2
  shared_preferences: ^2.2.3
  skeletonizer: ^2.1.3
  speech_to_text: ^7.3.0
  sqflite: ^2.4.2  
  strawti_utils:
    git:
      url: https://github.com/strawti-apps/strautils.git

dev_dependencies:
  build_runner: ^2.12.2
  custom_lint: ^0.8.1
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0  
  flutter_test:
    sdk: flutter
  hive_ce_generator: any
  mockito: ^5.6.3
  mocktail: ^1.0.4
  riverpod_generator: ^4.0.0+1
  

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/dragons/
    - assets/icons/
    - assets/animations/


flutter_native_splash:
  color: "#F52D5B"
  image: assets/images/logo-removebg-preview.png
  color_dark: "#F52D5B"
  android_12:
  fullscreen: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21

#dart run flutter_native_splash:create
#dart run build_runner build --delete-conflicting-outputs
